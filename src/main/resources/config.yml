# Spawn noktasi (/1v1 setspawn ile ayarlanir). Ayarlanmazsa ana dunyanin spawn'i kullanilir.
spawn:
  world: ""
  x: 0
  y: 0
  z: 0
  yaw: 0
  pitch: 0

# Ses isimleri: eski enum isimleri (ENTITY_PLAYER_LEVELUP) veya anahtar (entity.player.levelup) olabilir.
# Bos birakirsan ses calinmaz.
sesler:
  kapi-kapanma: BLOCK_IRON_DOOR_CLOSE
  arena-baslama: ENTITY_PLAYER_LEVELUP
  arena-bitis: ENTITY_WITHER_DEATH
  oyuncu-oldu: ENTITY_PLAYER_DEATH
  kazanma: ENTITY_PLAYER_LEVELUP
