# ============================================
#          1v1 ARENA CONFIG
# ============================================
# Not: Eski config dosyalarinda olmayan ayarlar plugin acilirken otomatik eklenir.

arena:
  # Mac suresi (saniye). 600 = 10 dakika. Sure dolarsa mac berabere biter.
  mac-suresi: 600
  # Kazananin itemleri toplama suresi (saniye). Bu sure bitince kapilar acilir ve kazanan spawn'a isinlanir.
  bitis-bekleme-suresi: 30
  # Berabere bitiste (sure dolunca) kapilarin acilmasina kadar beklenecek sure (saniye).
  kapi-silme-suresi: 2
  # Mac sirasinda oyundan cikan oyuncu oldurulsun mu? (true = itemleri arenaya duser, rakip toplar)
  cikista-oldur: true
  # Spawn'a isinlanirken efekt oynatilsin mi?
  efekt-ver: true
  # Bukkit Effect ismi (ornek: ENDER_SIGNAL, MOBSPAWNER_FLAMES). Bos birakirsan efekt oynatilmaz.
  teleport-efekti: ENDER_SIGNAL
  # Mac sirasinda (ve kazanan item toplarken) kullanilabilecek komutlar. arena.bypass yetkisi olanlar muaftir.
  izinli-komutlar:
    - 1v1
    - arena
    - 1v1arena
    - help

